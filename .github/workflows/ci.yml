name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  html:
    name: HTML válido
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar el HTML
        run: npx --yes html-validate@9 "**/*.html"
  enlaces:
    name: Enlaces vivos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Comprobar si hay enlaces
        id: comprobar-enlaces
        run: |
          if grep -R -q 'href=' --include="*.html" .; then
            echo "hay_enlaces=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay_enlaces=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comprobar los enlaces
        if: steps.comprobar-enlaces.outputs.hay_enlaces == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 "**/*.html"
          fail: true
  formato:
    name: Formato
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar el formato
        run: npx --yes prettier@3 --check "**/*.{html,css,json,md}"